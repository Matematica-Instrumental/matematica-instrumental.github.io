# Configuração do Pages CMS (DEC-106 a DEC-109).
# Telas e campos aprovados em Documentos/CMS-TELAS-E-CAMPOS-v1.0.md.
# Os schemas de Site/src/content.config.ts continuam sendo a fonte de verdade:
# conteúdo inválido faz o build falhar e o site anterior continua no ar.
media:
- name: arquivos
  label: Arquivos
  input: Site/public/arquivos
  output: /arquivos
  categories:
  - document
  - spreadsheet
  - image
  - compressed
  rename: safe
content:
- name: turmas
  label: Turmas
  type: collection
  path: Site/src/content/turmas
  format: yaml
  filename: '{fields.id}.yaml'
  view:
    fields:
    - nome
    - anoLetivo
    - arquivada
    primary: nome
  fields:
  - name: id
    label: Identificador
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9]+(-[a-z0-9]+)*$
      message: Use minúsculas, números e hífens, sem acentos.
    description: 'Ex.: ensino-medio-1o-ano-turma-a-2026. Vira o nome do arquivo; não altere depois de
      criado.'
  - name: nome
    label: Nome
    type: string
    required: true
    description: 'Ex.: Turma A — 2026.'
  - name: slug
    label: Endereço da página
    type: string
    required: true
    description: 'Minúsculas e hífens, com o ano. Ex.: turma-a-2026. Não altere depois de publicada.'
    pattern:
      regex: ^[a-z0-9]+(-[a-z0-9]+)*$
      message: Use minúsculas, números e hífens, sem acentos.
  - name: segmento
    label: Segmento
    type: select
    required: true
    options:
      values:
      - Ensino Fundamental — Anos Finais
      - Ensino Médio
  - name: anoSerie
    label: Ano/Série
    type: select
    required: true
    description: Deve pertencer ao segmento.
    options:
      values:
      - 6º ano
      - 7º ano
      - 8º ano
      - 9º ano
      - 1º ano
      - 2º ano
      - 3º ano
  - name: turma
    label: Turma
    type: string
    required: true
    description: 'Ex.: A.'
  - name: anoLetivo
    label: Ano letivo
    type: number
    required: true
    description: 'Ex.: 2026.'
  - name: descricao
    label: Descrição
    type: text
    required: true
  - name: arquivada
    label: Arquivada
    type: boolean
    description: Marque ao fim do ano letivo.
  - name: ordem
    label: Ordem
    type: number
    required: true
    description: Posição na lista de turmas.
- name: regimesLetivos
  label: Regimes letivos
  type: collection
  path: Site/src/content/regimes-letivos
  format: yaml
  filename: '{fields.id}.yaml'
  view:
    fields:
    - nome
    - anoLetivo
    - tipo
    primary: nome
  fields:
  - name: id
    label: Identificador
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9]+(-[a-z0-9]+)*$
      message: Use minúsculas, números e hífens, sem acentos.
    description: Minúsculas e hífens, sem acentos. Vira o nome do arquivo; não altere depois de criado.
  - name: nome
    label: Nome
    type: string
    required: true
    description: 'Ex.: Bimestres 2026.'
  - name: anoLetivo
    label: Ano letivo
    type: number
    required: true
  - name: tipo
    label: Tipo
    type: select
    required: true
    description: bimestral = 4 períodos; trimestral = 3; semestral = 2.
    options:
      values:
      - bimestral
      - trimestral
      - semestral
  - name: turmas
    label: Turmas
    type: reference
    description: Deixe vazio se o regime vale para todas as turmas do ano.
    options:
      collection: turmas
      value: '{fields.slug}'
      label: '{fields.nome} — {fields.anoLetivo}'
      search: nome
      multiple: true
- name: periodosLetivos
  label: Períodos letivos
  type: collection
  path: Site/src/content/periodos-letivos
  format: yaml
  filename: '{fields.id}.yaml'
  view:
    fields:
    - nome
    - dataInicial
    - dataFinal
    primary: nome
  fields:
  - name: id
    label: Identificador
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9]+(-[a-z0-9]+)*$
      message: Use minúsculas, números e hífens, sem acentos.
    description: Minúsculas e hífens, sem acentos. Vira o nome do arquivo; não altere depois de criado.
  - name: regimeLetivo
    label: Regime letivo
    type: reference
    required: true
    options:
      collection: regimesLetivos
      value: '{fields.id}'
      label: '{fields.nome}'
      search: nome
  - name: nome
    label: Nome
    type: string
    required: true
    description: 'Ex.: 1º Bimestre.'
  - name: dataInicial
    label: Data inicial
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: dataFinal
    label: Data final
    type: date
    required: true
    description: Igual ou posterior à inicial; sem sobrepor outro período do regime.
    options:
      format: yyyy-MM-dd
  - name: valorTotalEtapa
    label: Valor total da etapa
    type: number
    required: true
    description: Pontos da etapa. Se a soma do cronograma passar disso, o build avisa sem bloquear.
    options:
      min: 0
      step: 0.1
  - name: ordem
    label: Ordem
    type: number
    required: true
    description: 1, 2, 3… na ordem das datas.
    options:
      min: 1
- name: itensCronograma
  label: Cronograma (itens)
  type: collection
  path: Site/src/content/itens-cronograma
  format: yaml
  filename: '{fields.id}.yaml'
  view:
    fields:
    - dataPrazo
    - descricaoConteudo
    primary: descricaoConteudo
  fields:
  - name: id
    label: Identificador
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9]+(-[a-z0-9]+)*$
      message: Use minúsculas, números e hífens, sem acentos.
    description: Minúsculas e hífens, sem acentos. Vira o nome do arquivo; não altere depois de criado.
  - name: periodoLetivo
    label: Período letivo
    type: reference
    required: true
    options:
      collection: periodosLetivos
      value: '{fields.id}'
      label: '{fields.nome}'
      search: nome
  - name: turmas
    label: Turmas
    type: reference
    required: true
    options:
      collection: turmas
      value: '{fields.slug}'
      label: '{fields.nome} — {fields.anoLetivo}'
      search: nome
      multiple: true
  - name: dataPrazo
    label: Data/Prazo
    type: date
    required: true
    description: No dia seguinte o item aparece como cumprido.
    options:
      format: yyyy-MM-dd
  - name: tipo
    label: Tipo
    type: reference
    required: true
    description: Para incluir opções, use Listas → Tipos de cronograma.
    options:
      collection: tiposCronograma
      value: '{fields.id}'
      label: '{fields.nome}'
      search: nome
  - name: descricaoConteudo
    label: Descrição/Conteúdo
    type: text
    required: true
  - name: valorIndividual
    label: Valor
    type: number
    description: Sem valor, o item não entra na soma.
    options:
      min: 0
      step: 0.1
  - name: publicacao
    label: Publicação
    type: date
    description: Preencha para aparecer em Novidades.
    options:
      format: yyyy-MM-dd
  - name: ordem
    label: Ordem
    type: number
    description: Desempate entre itens da mesma data.
  - name: destaqueNovidades
    label: Destaque em Novidades
    type: object
    description: Opcional. O fim deve ser igual ou posterior ao início e à publicação.
    fields:
    - name: inicio
      label: Início
      type: date
      required: true
      options:
        format: yyyy-MM-dd
    - name: fim
      label: Fim
      type: date
      required: true
      options:
        format: yyyy-MM-dd
